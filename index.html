<style>
/* Layout: toolbar on top, the puzzle sheet fills the rest; the on-screen keyboard docks at the bottom in typing mode */
:root {
  --bg: #e9edf1;
  --sheet: #ffffff;
  --clue: #d7e5ef;
  --clue-fg: #1d2a35;
  --line: #7b8b99;
  --line-soft: #b8c4ce;
  --fg: #18222b;
  --muted: #5b6a77;
  --ink: #2338a8;
  --accent: #2338a8;
  --accent-fg: #ffffff;
  --mark: #ffe48a;
  --mark-soft: #fff4c8;
  --bad: #c62f3a;
  --hint: #1f7a52;
  --chip: #ffffff;
  --chip-line: #c5cfd8;
  --key: #ffffff;
  --key-line: #c9d2da;
  --shadow: 0 1px 2px rgba(20,35,50,.08), 0 4px 16px rgba(20,35,50,.08);
  --f-display: "Unbounded", "PT Sans", system-ui, sans-serif;
  --f-ui: "PT Sans", system-ui, -apple-system, sans-serif;
  --f-clue: "PT Sans Narrow", "Arial Narrow", "PT Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171c; --sheet: #1b2229; --clue: #243442; --clue-fg: #d9e4ec;
    --line: #52616e; --line-soft: #34414c; --fg: #e3e9ee; --muted: #93a2ae;
    --ink: #a9bcff; --accent: #8fa6ff; --accent-fg: #0f1420;
    --mark: #5a4b17; --mark-soft: #393220; --bad: #ff7a83; --hint: #5fd1a0;
    --chip: #1b2229; --chip-line: #34414c; --key: #222b33; --key-line: #34414c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171c; --sheet: #1b2229; --clue: #243442; --clue-fg: #d9e4ec;
  --line: #52616e; --line-soft: #34414c; --fg: #e3e9ee; --muted: #93a2ae;
  --ink: #a9bcff; --accent: #8fa6ff; --accent-fg: #0f1420;
  --mark: #5a4b17; --mark-soft: #393220; --bad: #ff7a83; --hint: #5fd1a0;
  --chip: #1b2229; --chip-line: #34414c; --key: #222b33; --key-line: #34414c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-ui);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overflow: hidden;
}
#app {
  height: 100%; display: flex; flex-direction: column;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px 8px; box-sizing: border-box; gap: 10px;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* toolbar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.brand small { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--chip); border: 1px solid var(--chip-line); border-radius: 10px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.btn { border: 1px solid var(--chip-line); background: var(--chip); border-radius: 10px; padding: 8px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.btn svg, .seg svg { width: 18px; height: 18px; flex: none; }
.chip { border: 1px solid var(--chip-line); background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--clue); border-color: var(--line); font-weight: 700; }
.sub { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.confirm { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }

/* stage */
#main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
#app.wide #main { flex-direction: row; }
#app.wide #stage { flex: 1 1 58%; }
#app.wide #dock { flex: 1 1 42%; min-width: 360px; max-width: 560px; justify-content: flex-end; }
#app.wide #kb button { height: clamp(44px, 7vh, 60px); }
#stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: flex-start; justify-content: center; overflow: auto; }
#sheet { position: relative; background: var(--sheet); box-shadow: var(--shadow); border: 2px solid var(--line); }
#grid { display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); grid-auto-rows: var(--cell); }
.cell { position: relative; box-sizing: border-box; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); overflow: hidden; }
.cell.L { background: var(--sheet); }
.cell.C { background: var(--clue); color: var(--clue-fg); display: flex; flex-direction: column; border-color: var(--line); }
.cell.X { background: repeating-linear-gradient(135deg, var(--clue) 0 3px, transparent 3px 7px), var(--sheet); opacity: .7; }
.cell.C .q { flex: 1; min-height: 0; padding: 2px 3px; box-sizing: border-box; font-family: var(--f-clue); line-height: 1.05; text-align: center; display: flex; align-items: center; justify-content: center; overflow: hidden; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; }
.cell.C .q + .q { border-top: 1px solid var(--line); }
.cell.C .q span { display: block; max-height: 100%; }
.cell.C .q b { font-weight: 700; color: var(--accent); white-space: nowrap; }
.cell.C.on { background: var(--mark); }
.cell.C .q.on { background: var(--mark); }
.cell.L.word { background: var(--mark-soft); }
.cell.L.sel { background: var(--mark); }
.cell .ch { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: calc(var(--cell) * .56); line-height: 1; color: var(--fg); }
.cell .ch.bad { color: var(--bad); }
.cell .ch.hinted { color: var(--hint); }
.cell .ans { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: calc(var(--cell) * .56); color: var(--muted); opacity: .45; }
.mk { position: absolute; width: calc(var(--cell) * .3); height: calc(var(--cell) * .3); color: var(--line); pointer-events: none; }
.mk.l { left: 0; top: calc(50% - var(--cell) * .15); }
.mk.t { top: 0; left: calc(50% - var(--cell) * .15); }
.mk.lt { left: 0; top: 0; }
#ink { position: absolute; left: 0; top: 0; pointer-events: none; touch-action: none; }
#stage.pen #ink { pointer-events: auto; }
#stage.pen { touch-action: none; }

#busy { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); font-family: var(--f-display); font-size: 15px; letter-spacing: .04em; z-index: 5; }
#toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); padding: 10px 16px; border-radius: 12px; font-weight: 700; box-shadow: var(--shadow); z-index: 6; max-width: calc(100% - 32px); text-align: center; }

/* keyboard dock */
#dock { display: flex; flex-direction: column; gap: 8px; padding-bottom: env(safe-area-inset-bottom, 0px); }
#cluebar { display: flex; align-items: center; gap: 10px; min-height: 40px; background: var(--sheet); border: 1px solid var(--line-soft); border-radius: 12px; padding: 6px 12px; }
#cluebar .arrow { font-weight: 700; color: var(--accent); font-size: 18px; }
#cluebar .text { flex: 1; font-size: 16px; min-width: 0; }
#cluebar .len { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#kb { display: flex; flex-direction: column; gap: 6px; }
#kb .row { display: flex; gap: 5px; justify-content: center; }
#kb button { flex: 1 1 0; max-width: 64px; min-width: 0; height: clamp(40px, 6.2vh, 54px); border-radius: 8px; border: 1px solid var(--key-line); background: var(--key); font-size: clamp(16px, 2.4vw, 21px); font-weight: 700; padding: 0; }
#kb button.wide { flex: 1.6 1 0; max-width: 104px; font-size: 14px; font-weight: 400; }
#kb button:active { background: var(--clue); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 560px) { .brand h1 { font-size: 16px; } .seg button { padding: 6px 9px; } .btn { padding: 7px 10px; } }
</style>

</head>

    </div>
    <div class="group" id="themeChips">

    </div>
  </div>
  <div id="main">
  <div id="stage" class="pen">

    <div id="busy" hidden>Составляю сканворд…</div>
    <div id="toast" hidden></div>
  </div>
  <div id="dock" hidden>

    <div id="kb"></div>

</div>

function parseDict(dict, themes) {
  const map = new Map();
  for (const theme of themes) {
    const src = dict[theme];
    if (!src) continue;
    for (const raw of src.split('\n')) {
      const line = raw.trim();
      if (!line) continue;
      const i = line.indexOf('|');
      if (i < 0) continue;
      const w = line.slice(0, i).toUpperCase().replace(/Ё/g, 'Е').replace(/[\s-]/g, '');
      if (!/^[А-Я]{3,10}$/.test(w)) continue;
      const clues = line.slice(i + 1).split(';').map(s => s.trim()).filter(Boolean);
      if (map.has(w)) {
        const e = map.get(w);
        for (const c of clues) if (!e.clues.includes(c)) e.clues.push(c);
        if (theme !== 'classic') e.theme = theme;
      } else map.set(w, { w, clues, theme });
    }
  }
  return [...map.values()];
}

// Placement kinds:
//   R  clue left of start, word goes right    D  clue above start, word goes down
//   RD clue left of start, word goes down     DR clue above start, word goes right
function Board(W, H, words, rnd) {
  const N = W * H;
  const byLen = {};
  for (const w of words) (byLen[w.w.length] ||= []).push(w);
  const maxLen = Math.min(10, Math.max(W, H));
  const S = { T: null, CH: null, UH: null, UV: null, CL: null, used: null, list: [] };
  const idx = (r, c) => (r < 0 || c < 0 || r >= H || c >= W) ? -1 : r * W + c;

  function reset() {
    S.T = new Uint8Array(N); S.CH = new Array(N).fill('');
    S.UH = new Uint8Array(N); S.UV = new Uint8Array(N);
    S.CL = Array.from({ length: N }, () => []);
    S.used = new Set(); S.list = [];
  }

  function frame(r0, c0, dir, len, kind) {
    const { T, CL, UH, UV, CH } = S;
    const dr = dir === 'h' ? 0 : 1, dc = dir === 'h' ? 1 : 0;
    let cr, cc;
    if (kind === 'R' || kind === 'RD') { cr = r0; cc = c0 - 1; } else { cr = r0 - 1; cc = c0; }
    const ci = idx(cr, cc);
    if (ci < 0 || T[ci] === 2) return null;
    if (T[ci] === 1) {
      if (CL[ci].length >= 2) return null;
      for (const k of CL[ci]) if (k.r === r0 && k.c === c0 && k.dir === dir) return null;
    }
    const bi = idx(r0 - dr, c0 - dc);
    if (bi >= 0 && T[bi] === 2) return null;
    const ai = idx(r0 + dr * len, c0 + dc * len);
    if (ai >= 0 && T[ai] === 2) return null;
    if (ai === ci && ai >= 0) return null;
    let pat = '', cross = 0;
    for (let k = 0; k < len; k++) {
      const r = r0 + dr * k, c = c0 + dc * k;
      const i = idx(r, c);
      if (i < 0 || T[i] === 1 || i === ci) return null;
      if (T[i] === 2) {
        if (dir === 'h' ? UH[i] : UV[i]) return null;
        pat += CH[i]; cross++;
      } else {
        const n1 = idx(r - dc, c - dr), n2 = idx(r + dc, c + dr);
        if ((n1 >= 0 && T[n1] === 2) || (n2 >= 0 && T[n2] === 2)) return null;
        pat += '.';
      }
    }
    return { ci, bi, ai, pat, cross, cr, cc };
  }

  function place(p, fr) {
    const { T, CH, UH, UV, CL } = S;
    const dr = p.dir === 'h' ? 0 : 1, dc = p.dir === 'h' ? 1 : 0;
    T[fr.ci] = 1;
    CL[fr.ci].push({ r: p.r0, c: p.c0, dir: p.dir, k: S.list.length });
    if (fr.bi >= 0 && T[fr.bi] === 0) T[fr.bi] = 1;
    if (fr.ai >= 0 && T[fr.ai] === 0) T[fr.ai] = 1;
    for (let k = 0; k < p.word.w.length; k++) {
      const i = idx(p.r0 + dr * k, p.c0 + dc * k);
      T[i] = 2; CH[i] = p.word.w[k];
      if (p.dir === 'h') UH[i] = 1; else UV[i] = 1;
    }
    S.list.push(p);
    S.used.add(p.word.w);
  }

  const match = (w, pat) => {
    for (let k = 0; k < pat.length; k++) if (pat[k] !== '.' && pat[k] !== w[k]) return false;
    return true;
  };

  function seed() {
    const lens = [];
    for (let L = Math.min(8, W - 1); L >= 4; L--) if (byLen[L]) lens.push(L);
    const L = lens[Math.floor(rnd() * Math.min(3, lens.length))];
    const pool = byLen[L];
    const word = pool[Math.floor(rnd() * pool.length)];
    const p = { r0: 1, c0: 1, dir: 'h', kind: 'R', word };
    place(p, frame(1, 1, 'h', L, 'R'));
  }

  const kindsFor = { h: ['R', 'DR'], v: ['D', 'RD'] };
  function grow() {
    const { T, UH, UV } = S;
    for (let iter = 0; iter < 500; iter++) {
      let best = null, bestScore = -1;
      const seen = new Set();
      for (let a = 0; a < N; a++) {
        if (T[a] !== 2) continue;
        const ar = (a / W) | 0, ac = a % W;
        const dir = UH[a] ? (UV[a] ? null : 'v') : 'h';
        if (!dir) continue;
        const dr = dir === 'h' ? 0 : 1, dc = dir === 'h' ? 1 : 0;
        for (let k = 0; k < maxLen; k++) {
          const r0 = ar - dr * k, c0 = ac - dc * k;
          if (r0 < 0 || c0 < 0) break;
          if (k > 0 && T[idx(r0, c0)] === 1) break;
          for (let len = Math.max(3, k + 1); len <= maxLen; len++) {
            const er = r0 + dr * (len - 1), ec = c0 + dc * (len - 1);
            if (er >= H || ec >= W) break;
            if (T[idx(er, ec)] === 1) break;
            const pool = byLen[len];
            if (!pool) continue;
            for (const kind of kindsFor[dir]) {
              const key = (r0 * W + c0) * 64 + len * 4 + (kind === 'R' || kind === 'D' ? 0 : 1) + (dir === 'h' ? 0 : 2);
              if (seen.has(key)) continue;
              seen.add(key);
              const fr = frame(r0, c0, dir, len, kind);
              if (!fr || fr.cross === 0) continue;
              const start = (rnd() * pool.length) | 0;
              for (let j = 0; j < pool.length; j++) {
                const word = pool[(start + j) % pool.length];
                if (S.used.has(word.w) || !match(word.w, fr.pat)) continue;
                const reuse = T[fr.ci] === 1 ? 2.5 : 0;
                const edge = (fr.cr === 0 || fr.cc === 0) ? 1.5 : 0;
                const straight = (kind === 'R' || kind === 'D') ? 0.6 : 0;
                const theme = word.theme !== 'classic' ? 1 : 0;
                const score = fr.cross * 3 + len * 0.7 + reuse + edge + straight + theme + rnd() * 2.5;
                if (score > bestScore) { bestScore = score; best = { p: { r0, c0, dir, kind, word }, fr }; }
                break;
              }
            }
          }
        }
      }
      if (!best) break;
      place(best.p, best.fr);
    }
  }

  function evaluate() {
    const { T, CL } = S;
    let filled = 0, crossings = 0;
    for (let i = 0; i < N; i++) {
      if (T[i] === 2) { filled++; if (S.UH[i] && S.UV[i]) crossings++; }
      else if (T[i] === 1 && CL[i].length) filled++;
    }
    return filled / N + crossings / N * 0.15;
  }

  function rebuild(list) {
    reset();
    for (const p of list) {
      const fr = frame(p.r0, p.c0, p.dir, p.word.w.length, p.kind);
      if (fr && match(p.word.w, fr.pat)) place(p, fr);
    }
  }

  function snapshot() { return S.list.slice(); }

  function result() {
    const { T, CH, CL } = S;
    const cells = [], entries = [];
    for (const p of S.list) {
      entries.push({
        w: p.word.w, clue: p.word.clues[(rnd() * p.word.clues.length) | 0], theme: p.word.theme,
        r: p.r0, c: p.c0, dir: p.dir, kind: p.kind,
      });
    }
    let empty = 0;
    for (let i = 0; i < N; i++) {
      if (T[i] === 2) cells.push({ t: 'L', ch: CH[i] });
      else if (T[i] === 1 && CL[i].length) cells.push({ t: 'C', clues: CL[i].map(x => x.k) });
      else { cells.push({ t: 'X' }); empty++; }
    }
    for (let i = 0; i < N; i++) {
      if (cells[i].t !== 'C') continue;
      const r = (i / W) | 0, c = i % W;
      for (const k of cells[i].clues) { entries[k].cr = r; entries[k].cc = c; }
    }
    return { W, H, cells, entries, empty, fill: 1 - empty / N };
  }

  return { reset, seed, grow, evaluate, rebuild, snapshot, result, S };
}

// Greedy build plus a "ruin and recreate" loop: drop a few words, regrow, keep if better.
function generate(W, H, words, ms = 1200, rnd = Math.random) {
  const t0 = Date.now();
  const b = Board(W, H, words, rnd);
  let bestList = null, bestScore = -1;
  for (let s = 0; s < 3; s++) {
    b.reset(); b.seed(); b.grow();
    const sc = b.evaluate();
    if (sc > bestScore) { bestScore = sc; bestList = b.snapshot(); }
  }
  let cur = bestList, curScore = bestScore, iters = 0;
  while (Date.now() - t0 < ms) {
    iters++;
    const keep = cur.slice();
    const drop = 2 + ((rnd() * 4) | 0);
    // drop a cluster: pick a random word and the words nearest to it
    const pivot = keep[(rnd() * keep.length) | 0];
    keep.sort((a, b2) => (Math.abs(a.r0 - pivot.r0) + Math.abs(a.c0 - pivot.c0)) - (Math.abs(b2.r0 - pivot.r0) + Math.abs(b2.c0 - pivot.c0)));
    const next = keep.slice(drop);
    // keep original order for rebuild
    const order = new Set(next);
    b.rebuild(cur.filter(p => order.has(p)));
    if (!b.S.list.length) b.seed();
    b.grow();
    const sc = b.evaluate();
    if (sc >= curScore) { cur = b.snapshot(); curScore = sc; if (sc > bestScore) { bestScore = sc; bestList = cur; } }
  }
  b.rebuild(bestList);
  const res = b.result();
  res.iters = iters;
  return res;
}

if (typeof module !== 'undefined') module.exports = { parseDict, generate };


(function () {

  let st = load() || {};

  if ((st.settings.v || 1) < 2) { for (const t of ['hollywood', 'fashion']) if (!st.settings.themes.includes(t)) st.settings.themes.push(t); st.settings.v = 2; }

  let bad = new Set();
  let showAns = false;

  let cellPx = 60;
  let cellMap = [];                      // per cell {h: entryIdx, v: entryIdx}

  function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  let saveT = 0;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify({ settings: st.settings, solved: st.solved, count: st.count, puzzle: P, typed, hinted, strokes, done: st.done })); } catch (e) {}
    }, 250);
  }

  /* ---------- generation ---------- */
  function newPuzzle() {
    $('busy').hidden = false;
    setTimeout(() => {
      const [W, H] = SIZES[st.settings.size];

      const words = parseDict(DICT, themes);

      showAns = false; $('ansBtn').setAttribute('aria-pressed', 'false');

      save();
    }, 40);
  }

  /* ---------- rendering ---------- */
  const GLYPH = { R: '→', D: '↓', RD: '↴', DR: '↳' };
  const ORDER = { R: 0, DR: 1, D: 2, RD: 3 };
  const MARK = {
    R: '<svg class="mk l" viewBox="0 0 10 10"><path d="M0 2.6L5.2 5 0 7.4z" fill="currentColor"/></svg>',
    D: '<svg class="mk t" viewBox="0 0 10 10"><path d="M2.6 0L5 5.2 7.4 0z" fill="currentColor"/></svg>',
    RD: '<svg class="mk lt" viewBox="0 0 10 10"><path d="M0 2.5h4.5v4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2.6 6.2L4.5 9 6.4 6.2z" fill="currentColor"/></svg>',
    DR: '<svg class="mk lt" viewBox="0 0 10 10"><path d="M2.5 0v4.5h4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6.2 2.6L9 4.5 6.2 6.4z" fill="currentColor"/></svg>',
  };

  function build() {
    if (!P) return;
    const { W, H, cells, entries } = P;
    cellMap = cells.map(() => ({ h: -1, v: -1, starts: [] }));
    entries.forEach((e, k) => {
      for (let i = 0; i < e.w.length; i++) {
        const r = e.r + (e.dir === 'v' ? i : 0), c = e.c + (e.dir === 'h' ? i : 0);
        cellMap[r * W + c][e.dir] = k;

      cellMap[e.r * W + e.c].starts.push(k);
    });
    gridEl.style.setProperty('--cols', W);

      } else if (x.t === 'C') {
        const ks = x.clues.slice().sort((a, b) => ORDER[entries[a].kind] - ORDER[entries[b].kind]);
        html += `<div class="cell C" data-i="${i}">` + ks.map(k => `<div class="q" data-k="${k}"><span>${esc(entries[k].clue)} <b>${GLYPH[entries[k].kind]}</b></span></div>`).join('') + `</div>`;

      if (i >= W * (H - 1)) el.style.borderBottom = '0';

    layout();

  function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function layout() {
    if (!P) return;

        gridEl.children[idx].classList.add('word');

      const q = gridEl.querySelector(`.q[data-k="${k}"]`);
      if (q) q.classList.add('on');
      setClueBar(e);
    } else setClueBar(null);
    gridEl.children[sel].classList.add('sel');
  }
  function setClueBar(e) {
    $('cbArrow').textContent = e ? GLYPH[e.kind] : '';
    $('cbText').textContent = e ? e.clue : 'Нажмите на клетку или вопрос';
    $('cbLen').textContent = e ? plural(e.w.length) : '';
  }
  function plural(n) { const m10 = n % 10, m100 = n % 100; const w = (m10 === 1 && m100 !== 11) ? 'буква' : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? 'буквы' : 'букв'; return n + ' ' + w; }

  function updateStat() {
    $('stat').textContent = P ? `№ ${P.no || 1} · решено: ${st.solved}` : '';
  }

  /* ---------- keyboard mode ---------- */
  gridEl.addEventListener('click', ev => {
    if (st.settings.mode !== 'kb' || !P) return;
    const cell = ev.target.closest('.cell');
    if (!cell) return;
    const i = +cell.dataset.i;
    if (cell.classList.contains('L')) {
      const m = cellMap[i];
      if (sel === i) { const o = selDir === 'h' ? 'v' : 'h'; if (m[o] >= 0) selDir = o; }
      else { sel = i; if (m[selDir] < 0) selDir = m.h >= 0 ? 'h' : 'v'; }
      paintSelection();
    } else if (cell.classList.contains('C')) {
      const q = ev.target.closest('.q') || cell.querySelector('.q');
      if (!q) return;
      const e = P.entries[+q.dataset.k];
      sel = e.r * P.W + e.c; selDir = e.dir;
      paintSelection();
    }
  });

  function step(delta) {
    const k = cellMap[sel][selDir];
    if (k < 0) return;
    const e = P.entries[k];
    const pos = selDir === 'h' ? (sel % P.W) - e.c : Math.floor(sel / P.W) - e.r;
    const np = pos + delta;
    if (np < 0 || np >= e.w.length) return;
    sel = (e.r + (e.dir === 'v' ? np : 0)) * P.W + e.c + (e.dir === 'h' ? np : 0);
  }

  function typeLetter(ch) {
    if (sel == null || !P) return;
    ch = ch.toUpperCase().replace('Ё', 'Е');
    if (!/^[А-Я]$/.test(ch)) return;
    typed[sel] = ch; delete hinted[sel]; bad.delete(sel);
    step(1);
    afterChange();
  }
  function backspace() {
    if (sel == null || !P) return;
    if (typed[sel]) { delete typed[sel]; delete hinted[sel]; bad.delete(sel); }
    else { step(-1); delete typed[sel]; delete hinted[sel]; bad.delete(sel); }
    afterChange();
  }
  function afterChange() {
    refreshLetters(); save(); checkSolved();
  }
  function checkSolved() {
    if (!P || st.done) return;
    for (let i = 0; i < P.cells.length; i++) {
      const x = P.cells[i];
      if (x.t === 'L' && typed[i] !== x.ch) return;
    }
    st.done = true; st.solved++; updateStat(); save();
    toast('Готово! Сканворд решён');
  }

  const ROWS = ['ЙЦУКЕНГШЩЗХЪ', 'ФЫВАПРОЛДЖЭ', 'ЯЧСМИТЬБЮ'];
  (function buildKb() {
    const kb = $('kb');
    ROWS.forEach((row, ri) => {
      const r = document.createElement('div'); r.className = 'row';
      if (ri === 2) r.insertAdjacentHTML('beforeend', '<button type="button" class="wide" data-k="dir" aria-label="Сменить направление">↔ ↕</button>');
      for (const ch of row) r.insertAdjacentHTML('beforeend', `<button type="button" data-k="${ch}">${ch}</button>`);
      if (ri === 2) r.insertAdjacentHTML('beforeend', '<button type="button" class="wide" data-k="bs" aria-label="Стереть">⌫</button>');
      kb.appendChild(r);
    });
    kb.addEventListener('click', ev => {
      const b = ev.target.closest('button'); if (!b) return;
      const k = b.dataset.k;
      if (k === 'bs') backspace();
      else if (k === 'dir') { if (sel != null) { const o = selDir === 'h' ? 'v' : 'h'; if (cellMap[sel][o] >= 0) { selDir = o; paintSelection(); } } }
      else typeLetter(k);
    });
  })();

  const CODE = { KeyQ: 'Й', KeyW: 'Ц', KeyE: 'У', KeyR: 'К', KeyT: 'Е', KeyY: 'Н', KeyU: 'Г', KeyI: 'Ш', KeyO: 'Щ', KeyP: 'З', BracketLeft: 'Х', BracketRight: 'Ъ', KeyA: 'Ф', KeyS: 'Ы', KeyD: 'В', KeyF: 'А', KeyG: 'П', KeyH: 'Р', KeyJ: 'О', KeyK: 'Л', KeyL: 'Д', Semicolon: 'Ж', Quote: 'Э', KeyZ: 'Я', KeyX: 'Ч', KeyC: 'С', KeyV: 'М', KeyB: 'И', KeyN: 'Т', KeyM: 'Ь', Comma: 'Б', Period: 'Ю', Backquote: 'Е' };
  document.addEventListener('keydown', ev => {
    if (st.settings.mode !== 'kb' || sel == null || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === 'Backspace' || ev.key === 'Delete') { ev.preventDefault(); backspace(); return; }
    const arrows = { ArrowRight: ['h', 1], ArrowLeft: ['h', -1], ArrowDown: ['v', 1], ArrowUp: ['v', -1] };
    if (arrows[ev.key]) {
      ev.preventDefault();
      const [d, s] = arrows[ev.key];
      const r = Math.floor(sel / P.W) + (d === 'v' ? s : 0), c = sel % P.W + (d === 'h' ? s : 0);
      if (r >= 0 && c >= 0 && r < P.H && c < P.W && P.cells[r * P.W + c].t === 'L') { sel = r * P.W + c; if (cellMap[sel][d] >= 0) selDir = d; paintSelection(); }
      return;
    }
    let ch = ev.key && ev.key.length === 1 ? ev.key : '';
    if (!/^[а-яёА-ЯЁ]$/.test(ch)) ch = CODE[ev.code] || '';
    if (ch) { ev.preventDefault(); typeLetter(ch); }
  });

  $('checkBtn').addEventListener('click', () => {
    if (!P) return;
    bad.clear(); let n = 0, filled = 0, total = 0;
    P.cells.forEach((x, i) => { if (x.t !== 'L') return; total++; if (typed[i]) { filled++; if (typed[i] !== x.ch) { bad.add(i); n++; } } });
    refreshLetters();
    toast(n ? `Ошибок: ${n}. Они отмечены красным` : filled === total ? 'Всё верно!' : `Пока без ошибок · заполнено ${filled} из ${total}`);
  });
  $('hintBtn').addEventListener('click', () => {
    if (!P) return;
    if (sel == null) { toast('Сначала выберите клетку'); return; }
    typed[sel] = P.cells[sel].ch; hinted[sel] = 1; bad.delete(sel);
    step(1); afterChange();
  });
  $('ansBtn').addEventListener('click', () => {
    showAns = !showAns;
    $('ansBtn').setAttribute('aria-pressed', String(showAns));
    refreshLetters();
  });

  /* ---------- pen mode ---------- */
  let drawing = null, penSeen = false, erasing = false;
  function pt(ev) {
    const r = canvas.getBoundingClientRect();
    const p = ev.pointerType === 'pen' ? (ev.pressure || 0.5) : 0.5;
    return [(ev.clientX - r.left) / cellPx, (ev.clientY - r.top) / cellPx, p];
  }
  function inkColor() { return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#2338a8'; }
  function drawStroke(s, color) {
    const pts = s.pts; if (!pts.length) return;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0][0] * cellPx, pts[0][1] * cellPx, s.w * cellPx * 0.6, 0, 7); ctx.fill(); return; }
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      ctx.lineWidth = s.w * cellPx * (0.55 + (a[2] + b[2]) * 0.45);
      ctx.beginPath(); ctx.moveTo(a[0] * cellPx, a[1] * cellPx); ctx.lineTo(b[0] * cellPx, b[1] * cellPx); ctx.stroke();
    }
  }
  function redrawInk() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const c = inkColor();
    for (const s of strokes) drawStroke(s, c);
  }
  function pushHistory() { history.push(strokes.slice()); if (history.length > 60) history.shift(); }
  function eraseAt(p) {
    const R = 0.22;
    const before = strokes.length;
    strokes = strokes.filter(s => !s.pts.some(q => (q[0] - p[0]) ** 2 + (q[1] - p[1]) ** 2 < R * R));
    if (strokes.length !== before) redrawInk();
  }
  canvas.addEventListener('pointerdown', ev => {
    if (st.settings.mode !== 'pen') return;
    if (ev.pointerType === 'pen') penSeen = true;
    if (penSeen && ev.pointerType === 'touch') return;     // ignore the palm once Pencil is in use
    ev.preventDefault();
    canvas.setPointerCapture(ev.pointerId);
    pushHistory();
    if (st.settings.tool === 'eraser' || ev.button === 5) { erasing = true; eraseAt(pt(ev)); return; }
    drawing = { w: 0.035, pts: [pt(ev)], id: ev.pointerId };
    drawStroke(drawing, inkColor());
  });
  canvas.addEventListener('pointermove', ev => {
    if (penSeen && ev.pointerType === 'touch') return;
    const list = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev];
    if (erasing) { for (const e of list) eraseAt(pt(e)); return; }
    if (!drawing || ev.pointerId !== drawing.id) return;
    const c = inkColor();
    for (const e of list) {
      const p = pt(e);
      const last = drawing.pts[drawing.pts.length - 1];
      if ((p[0] - last[0]) ** 2 + (p[1] - last[1]) ** 2 < 0.0004) continue;
      drawing.pts.push(p);
      drawStroke({ w: drawing.w, pts: [last, p] }, c);
    }
  });
  function endStroke(ev) {
    if (erasing) { erasing = false; save(); return; }
    if (!drawing || ev.pointerId !== drawing.id) return;
    strokes.push({ w: drawing.w, pts: drawing.pts.map(p => [+p[0].toFixed(3), +p[1].toFixed(3), +p[2].toFixed(2)]) });
    drawing = null; save();
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  $('undoBtn').addEventListener('click', () => { if (!history.length) return; strokes = history.pop(); redrawInk(); save(); });
  let clearArm = 0;
  $('clearInk').addEventListener('click', () => {
    const b = $('clearInk');
    if (!strokes.length) return;
    if (!clearArm) { b.textContent = 'Точно стереть?'; clearArm = setTimeout(() => { b.textContent = 'Стереть всё'; clearArm = 0; }, 2500); return; }
    clearTimeout(clearArm); clearArm = 0; b.textContent = 'Стереть всё';
    pushHistory(); strokes = []; redrawInk(); save();
  });

  /* ---------- controls ---------- */
  function setWide() {
    const wide = st.settings.mode === 'kb' && innerWidth >= 900 && innerWidth > innerHeight * 1.15;
    document.getElementById('app').classList.toggle('wide', wide);
  }
  function setMode(m) {
    st.settings.mode = m;

    $('modePen').setAttribute('aria-pressed', String(m === 'pen'));
    $('modeKb').setAttribute('aria-pressed', String(m === 'kb'));
    stage.classList.toggle('pen', m === 'pen');
    $('penTools').hidden = m !== 'pen';
    $('kbTools').hidden = m !== 'kb';
    $('dock').hidden = m !== 'kb';
    setWide();
    if (m === 'kb' && sel == null && P) {
      const e = P.entries[0]; if (e) { sel = e.r * P.W + e.c; selDir = e.dir; }
    }
    paintSelection(); save();
    requestAnimationFrame(layout);
  }
  function setTool(t) {
    st.settings.tool = t;
    $('toolPen').setAttribute('aria-pressed', String(t === 'pen'));
    $('toolEraser').setAttribute('aria-pressed', String(t === 'eraser'));
    save();
  }
  $('modePen').addEventListener('click', () => setMode('pen'));
  $('modeKb').addEventListener('click', () => setMode('kb'));
  $('toolPen').addEventListener('click', () => setTool('pen'));
  $('toolEraser').addEventListener('click', () => setTool('eraser'));

  function paintSettings() {
    document.querySelectorAll('#sizeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.size === st.settings.size)));
    document.querySelectorAll('#themeChips .chip').forEach(b => b.setAttribute('aria-pressed', String(st.settings.themes.includes(b.dataset.themeKey))));
  }
  $('sizeSeg').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    st.settings.size = b.dataset.size; paintSettings(); save();
    toast('Размер применится к новому сканворду');
  });
  $('themeChips').addEventListener('click', ev => {
    const b = ev.target.closest('.chip'); if (!b) return;
    const k = b.dataset.themeKey, t = st.settings.themes;
    if (t.includes(k)) { if (t.length > 1) t.splice(t.indexOf(k), 1); else { toast('Нужна хотя бы одна тема'); return; } }
    else t.push(k);
    paintSettings(); save();
    toast('Темы применятся к новому сканворду');
  });

  function hasProgress() { return !st.done && (Object.keys(typed).length > 0 || strokes.length > 0); }
  $('newBtn').addEventListener('click', () => {
    if (!hasProgress()) { newPuzzle(); return; }
    const wrap = $('newWrap');
    wrap.innerHTML = '<span class="confirm">Начать новый? Текущий пропадёт <button class="btn primary" id="yesNew" type="button">Да</button><button class="btn" id="noNew" type="button">Нет</button></span>';
    $('yesNew').onclick = () => { restoreNew(); newPuzzle(); };
    $('noNew').onclick = restoreNew;
  });
  function restoreNew() {
    const wrap = $('newWrap');
    wrap.innerHTML = '';
    wrap.appendChild(newBtnEl);
  }
  const newBtnEl = $('newBtn');

  let toastT = 0;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
  }

  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { setWide(); layout(); }, 120); });
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener && mq.addEventListener('change', redrawInk);
  new MutationObserver(redrawInk).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  paintSettings();
  setTool(st.settings.tool);
  if (P) build(); else newPuzzle();
  setMode(st.settings.mode);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
})();
</script>

</body>
</html>
